<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventSphere · Event Management</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="container header-inner">
      <div class="logo">
        <i class="fas fa-calendar-check"></i>
        EventSphere
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle">
          <i class="fas fa-moon"></i>
          <span id="themeLabel">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== HERO ===== -->
    <section class="hero">
      <div class="container">
        <h1>Find your next experience</h1>
        <p>Discover, filter and register for the best events around you.</p>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search events by name, venue...">
          <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
        </div>
      </div>
    </section>

    <!-- ===== CATEGORY FILTERS ===== -->
    <div class="container">
      <div class="filter-section" id="filterSection">
        <button class="filter-btn active" data-category="all">All events</button>
        <button class="filter-btn" data-category="conference">Conference</button>
        <button class="filter-btn" data-category="workshop">Workshop</button>
        <button class="filter-btn" data-category="music">Music</button>
        <button class="filter-btn" data-category="sports">Sports</button>
        <button class="filter-btn" data-category="art">Art & Culture</button>
      </div>
    </div>

    <!-- ===== EVENT GRID ===== -->
    <div class="container">
      <div class="events-grid" id="eventsGrid"></div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container">
      <p>© 2025 EventSphere – connect, experience, remember.</p>
    </div>
  </footer>

  <!-- ===== REGISTRATION MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
